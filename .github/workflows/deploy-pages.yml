name: Deploy childhood cancer information site

on:
  push:
    branches: [main, biomarker]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Prepare public site files
        run: |
          mkdir -p _site/data
          cp index.html childhood_cancer_research.md childhood_cancer_research.pdf micro_nanorobots_childhood_cancer_review.md micro_nanorobots_childhood_cancer_review.pdf diabetes_trials_three_periods.pdf childhood-cancer-hope-progress.png childhood-cancer-short.mp4 nanorobot-short.mp4 video_narration.txt nanorobot-video_narration.txt dataset_analysis.md _site/
          cp data/*.csv data/*.svg _site/data/
          cp -R share _site/share

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
